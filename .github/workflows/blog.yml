name: Radar Delta - build diario (blog + SEO + card)
on:
  schedule:
    - cron: '0 12 * * *'   # todo dia 12:00 UTC (9h BRT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Gerar blog + paginas SEO
        run: |
          python3 blog.py
          python3 seo.py
      - name: Renderizar card do dia (SVG -> PNG)
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" --headless --disable-gpu --no-sandbox --force-device-scale-factor=1 --window-size=1200,630 --hide-scrollbars --screenshot=cards/card.png cards/card.svg
      - name: Commitar se mudou
        run: |
          git config user.name "Radar Delta bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Build diario: blog + SEO + card de $(date -u +%Y-%m-%d)"
          git push
